name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            bin: MediaBoy.exe
            archive: MediaBoy-windows-amd64.zip
          - os: ubuntu-latest
            goos: linux
            bin: MediaBoy
            archive: MediaBoy-linux-amd64.tar.gz
          - os: macos-latest
            goos: darwin
            bin: MediaBoy
            archive: MediaBoy-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Linux GUI deps
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libgtk-3-dev

      - name: Build
        working-directory: src
        shell: bash
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            go build -ldflags="-H windowsgui" -o "${{ matrix.bin }}" .
          else
            go build -o "${{ matrix.bin }}" .
          fi

      - name: Package
        shell: bash
        run: |
          mkdir -p pkg
          cp "src/${{ matrix.bin }}" pkg/
          cp src/video.gbc pkg/
          cp LICENSE README.md THIRD_PARTY.md pkg/
          cd pkg
          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a "../${{ matrix.archive }}" ./*
          else
            tar czf "../${{ matrix.archive }}" ./*
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
