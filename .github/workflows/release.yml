name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            bin: MediaBoy.exe
            archive: MediaBoy-windows-amd64.zip
          - os: ubuntu-latest
            goos: linux
            bin: MediaBoy
            archive: MediaBoy-linux-amd64.tar.gz
          - os: macos-latest
            goos: darwin
            bin: MediaBoy
            archive: MediaBoy-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed for the Windows version resource

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod

      - name: Install Linux GUI deps
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev libgtk-3-dev

      # The committed rsrc_windows_*.syso carries the icon and manifest; for a
      # release it is regenerated so the exe also gets the version from the tag.
      - name: Windows resources (icon + version)
        if: matrix.goos == 'windows'
        working-directory: src
        shell: bash
        run: |
          go install github.com/tc-hib/go-winres@latest
          go-winres simply --icon internal/ui/logo.png --manifest gui --arch amd64,arm64 \
            --product-name MediaBoy --file-description "MediaBoy" \
            --original-filename MediaBoy.exe \
            --product-version git-tag --file-version git-tag

      - name: Build
        working-directory: src
        shell: bash
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            go build -ldflags="-H windowsgui" -o "${{ matrix.bin }}" .
          else
            go build -o "${{ matrix.bin }}" .
          fi

      - name: Package
        shell: bash
        run: |
          mkdir -p pkg
          cp "src/${{ matrix.bin }}" pkg/
          cp LICENSE README.md THIRD_PARTY.md pkg/
          cd pkg
          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a "../${{ matrix.archive }}" ./*
          else
            tar czf "../${{ matrix.archive }}" ./*
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
